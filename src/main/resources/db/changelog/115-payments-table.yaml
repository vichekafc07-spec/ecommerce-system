databaseChangeLog:
  - changeSet:
        id: create-payments-table
        author: sorl-vichika
        changes:
          - createTable:
              tableName: payments
              columns:
                - column:
                    name: id
                    type: BIGINT
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: session_id
                    type: VARCHAR(255)

                - column:
                    name: transaction_id
                    type: VARCHAR(255)

                - column:
                    name: amount
                    type: DECIMAL(19,2)

                - column:
                    name: status
                    type: VARCHAR(50)

                - column:
                    name: order_id
                    type: BIGINT

          - addForeignKeyConstraint:
              baseTableName: payments
              baseColumnNames: order_id
              referencedTableName: orders
              referencedColumnNames: id
              constraintName: fk_payments_order