databaseChangeLog:
  - changeSet:
      id: create-product-table
      author: sorl vichika
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)

              - column:
                  name: description
                  type: VARCHAR(1000)

              - column:
                  name: code
                  type: VARCHAR(100)

              - column:
                  name: quantity
                  type: INT

              - column:
                  name: image_url
                  type: VARCHAR(500)

              - column:
                  name: cost_price
                  type: DECIMAL(10,2)

              - column:
                  name: price
                  type: DECIMAL(10,2)

              - column:
                  name: discount
                  type: DECIMAL(10,2)

              - column:
                  name: final_price
                  type: DECIMAL(10,2)

              - column:
                  name: category_id
                  type: TINYINT

              - column:
                  name: created_at
                  type: DATETIME

              - column:
                  name: updated_at
                  type: DATETIME

              - column:
                  name: created_by
                  type: VARCHAR(255)

              - column:
                  name: updated_by
                  type: VARCHAR(255)

              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false

              - column:
                  name: deleted_at
                  type: DATETIME

        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_product_category