databaseChangeLog:
  - changeSet:
        id: create-order-items-table
        author: sorl-vichika
        changes:
          - createTable:
              tableName: order_items
              columns:
                - column:
                    name: id
                    type: BIGINT
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: product_name
                    type: VARCHAR(255)

                - column:
                    name: product_price
                    type: DECIMAL(19,2)

                - column:
                    name: quantity
                    type: INT

                - column:
                    name: sub_total
                    type: DECIMAL(19,2)

                - column:
                    name: order_id
                    type: BIGINT

                - column:
                    name: product_id
                    type: BIGINT

          - addForeignKeyConstraint:
              baseTableName: order_items
              baseColumnNames: order_id
              referencedTableName: orders
              referencedColumnNames: id
              constraintName: fk_order_items_order

          - addForeignKeyConstraint:
              baseTableName: order_items
              baseColumnNames: product_id
              referencedTableName: products
              referencedColumnNames: id
              constraintName: fk_order_items_product