databaseChangeLog:
  - changeSet:
      id: create-wishlists-table
      author: sorl-vichika
      changes:
        - createTable:
            tableName: wishlists
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT

              - column:
                  name: product_id
                  type: BIGINT

        - addUniqueConstraint:
            tableName: wishlists
            columnNames: user_id, product_id
            constraintName: uq_wishlists_user_product

        - addForeignKeyConstraint:
            baseTableName: wishlists
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_wishlists_user

        - addForeignKeyConstraint:
            baseTableName: wishlists
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_wishlists_product